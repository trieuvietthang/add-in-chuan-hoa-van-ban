; Hồ sơ Quy định/Quy chế nội bộ (theo mẫu F3). Số Điều đếm liên tục toàn văn bản (resetonhigher=0).
[profile]
name=QuyDinh
title=Quy định nội bộ
levels=6
standard=ND30

[level1]
label=Chương
style=00Chuong
format=CHƯƠNG %1
numstyle=upperroman
numpos=0
textpos=0
trailing=space
bold=1
align=center
outline=1
resetonhigher=0
detect=^\s*(CHƯƠNG|Chương)\s+[IVXLC\d]+\s*[.:]?\s*

[level2]
label=Mục
style=00Muc
format=Mục %2.
numstyle=arabic
numpos=0
textpos=0
trailing=space
bold=1
align=left
outline=2
resetonhigher=1
detect=^\s*Mục\s+\d+\s*[.:]?\s*

[level3]
label=Điều
style=01Dieu
refkind=dieu
format=Điều %3.
numstyle=arabic
numpos=0
textpos=0
trailing=space
bold=1
align=justify
outline=3
resetonhigher=0
detect=^\s*(Điều|ĐIỀU)\s+\d+\s*[.:]?\s*

[level4]
label=Khoản
style=02Khoan
refkind=khoan
format=%4.
numstyle=arabic
numpos=0
textpos=1
trailing=tab
bold=0
align=justify
outline=0
resetonhigher=3
detect=^\s*\d+\.\s+

[level5]
label=Điểm
style=03Diem
refkind=diem
format=%5)
numstyle=lowerletter
numpos=1
textpos=2
trailing=tab
bold=0
align=justify
outline=0
resetonhigher=4
detect=^\s*[a-zđ]\)\s+

[level6]
label=Tiết
style=04Tiet
format=(%6)
numstyle=lowerroman
numpos=2
textpos=3
trailing=tab
bold=0
align=justify
outline=0
resetonhigher=5
detect=^\s*\([ivxl]+\)\s+

[toc]
entries=00Chuong:1;01Dieu:2
title=MỤC LỤC
