; Hồ sơ Hợp đồng (mặc định ban đầu theo mẫu F1; chỉnh được). Đơn vị thụt: cm.
[profile]
name=HopDong
title=Hợp đồng
levels=4
standard=ND30

[level1]
label=Điều
style=01Dieu
refkind=dieu
format=Điều %1.
numstyle=arabic
numpos=0
textpos=0
trailing=space
bold=1
align=justify
outline=1
detect=^\s*(Điều|ĐIỀU)\s+\d+\s*[.:]?\s*

[level2]
label=Khoản
style=02Khoan
refkind=khoan
format=%1.%2
numstyle=arabic
numpos=0
textpos=1.27
trailing=tab
bold=0
align=justify
outline=0
detect=^\s*\d+\.\d+\.?\s+

[level3]
label=Điểm
style=03Diem
refkind=diem
format=%3)
numstyle=lowerletter
numpos=1.27
textpos=2
trailing=tab
bold=0
align=justify
outline=0
detect=^\s*[a-zđ]\)\s+

[level4]
label=Tiết
style=04Tiet
format=(%4)
numstyle=lowerroman
numpos=2
textpos=2.75
trailing=tab
bold=0
align=justify
outline=0
detect=^\s*\([ivxl]+\)\s+

[toc]
entries=01Dieu:1
title=MỤC LỤC
