; Mẫu nhận diện dẫn chiếu nội bộ (UTF-8). find_dieu dùng cho Word Find (wildcards); các mẫu còn lại là regex VBScript (không phân biệt hoa thường).
[refs]
find_dieu=[Đđ]iều [0-9]{1,}
pre=(?:điểm\s+([a-zđ])\s+)?(?:khoản\s+(\d+)\s+)?$
external=^\s*(?:(?:,|và|hoặc|đến|tới)\s*(?:(?:khoản|điểm)\s+\w+\s+)*(?:điều\s+)?\d+\s*)*(của\s+)?(Luật|Bộ luật|Nghị định|Thông tư|Quyết định|Nghị quyết|Pháp lệnh|Hiến pháp|Công ước)
title=^\s*\(([^)]{3,120})\)
